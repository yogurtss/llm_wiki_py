[project]
name = "llm-wiki-python"
version = "0.1.0"
description = "A Python monolith migration of LLM Wiki using NiceGUI and server-side storage."
requires-python = ">=3.11"
dependencies = [
    "nicegui>=2.0.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["llm_wiki*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
